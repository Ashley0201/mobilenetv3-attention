experiment:
  id: smoke_baseline
  seed: 42
  deterministic: true
  output_root: outputs
model:
  name: mobilenet_v3_large
  num_classes: 10
  pretrained: none
  dropout: 0.2
data:
  config: configs/dataset_cifar10.yaml
  batch_size: 32
  eval_batch_size: 64
  num_workers: 0
  pin_memory: false
training:
  epochs: 1
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.01
  label_smoothing: 0.0
  warmup_epochs: 0
  grad_clip: null
  amp: true
  device: auto
  limit_train_batches: 10
evaluation:
  monitor: val_accuracy
  test_after_training: false
  limit_val_batches: 2
  report_metrics:
  - accuracy
  - precision_macro
  - recall_macro
  - f1_macro
  - confusion_matrix
  latency:
    batch_size: 1
    warmup: 2
    repeats: 5
dataset:
  name: cifar10
  root: C:\Users\Sylvia\Desktop\mobilenetv3-attention\data
  official_url: https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz
  archive_md5: c58f30108f718f92721af3b95e74349a
  num_classes: 10
  class_names:
  - airplane
  - automobile
  - bird
  - cat
  - deer
  - dog
  - frog
  - horse
  - ship
  - truck
  class_to_idx:
    airplane: 0
    automobile: 1
    bird: 2
    cat: 3
    deer: 4
    dog: 5
    frog: 6
    horse: 7
    ship: 8
    truck: 9
  split:
    strategy: stratified_holdout_from_official_train
    val_size: 5000
    train_size: 45000
    test_size: 10000
    seed: 42
  input_size: 224
  normalization:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  augmentation:
    random_resized_crop_scale:
    - 0.6
    - 1.0
    horizontal_flip: true
  download: false
  license_note: 数据集由官方页面公开发布用于研究；引用要求见官方页面（Krizhevsky 2009 技术报告）。
